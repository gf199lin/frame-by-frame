edition: 3.0.0
name: frame-by-frame-ai
access: default

vars:
  region: cn-hangzhou

resources:
  ai:
    component: fc3
    props:
      region: ${vars.region}
      functionName: frame-by-frame-ai
      description: Frame by Frame AI Core - note analysis API
      runtime: nodejs20
      code: ./dist-cloudfn
      handler: index.handler
      memorySize: 256
      timeout: 60
      instanceConcurrency: 10
      environmentVariables:
        # 密钥从部署机的环境变量读取，不写入本文件。
        DEEPSEEK_API_KEY: ${env.DEEPSEEK_API_KEY}
        AI_MODEL: ${env.AI_MODEL}
        DEEPSEEK_BASE_URL: ${env.DEEPSEEK_BASE_URL}
        ALLOWED_ORIGINS: ${env.ALLOWED_ORIGINS}
        AI_TIMEOUT_MS: "45000"
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - OPTIONS
